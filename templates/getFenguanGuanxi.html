{% extends "addTeacher.html" %}

{% block  body_block %}

<div class="Hui-article">
	<article class="cl pd-20">
		<h3 class="text-c">教师分管关系表</h3>
		<div class="mt-20">
			<table class="table table-border table-bordered table-hover table-bg table-sort">
				<thead>
					<tr class="text-c">
						<th width="100">副处级工号</th>
						<th width="100">副处级姓名</th>
						<th width="150">所属部门</th>
						<th width="100">分管校领导工号</th>
						<th width="100">分管校领导姓名</th>
					</tr>
				</thead>
				<tbody id="tab">

				</tbody>
			</table>
		</div>
	</article>
</div>

<script>
	$.ajax({
		async: false,
		type: 'POST',
		url: '/getFenguanGuanxi',
		data: {
		},
		dataType: 'json',
		success: function (data, stats) {
			for (var i = 0, len = data.length; i < len; i++) {
				$("#tab").append("\
				<tr class='text-c'>\
								<td>"+ data[i]['fuchu_t_id'] + "</td >\
								<td>"+ data[i]['fuchu_name'] + "</td >\
								<td>"+ data[i]['fuchu_bumen_name'] + " (ID:" + data[i]['fuchu_bumen_id'] + ")</td >\
								<td>"+ data[i]['xiaoji_t_id'] + "</td >\
								<td>"+ data[i]['xiaoji_name'] + "</td >\
							</tr >\
					");
			}

		},
		error: function (XMLHttpRequest, textStatus, errorThrown) {
			console.log('Wrong~');
		}
	}
	);
</script>
{% endblock %}
