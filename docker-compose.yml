services:
  mysql_ts:
    image: mysql:8.0.18
    container_name: mysql_ts
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
    container_name: app
    restart: unless-stopped
    depends_on:
      mysql_ts:
        condition: service_healthy
    environment:
      DB_HOST: mysql_ts
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123456
    ports:
      - "10081:80"

volumes:
  mysql_data: